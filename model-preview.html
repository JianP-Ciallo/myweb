<!doctype html><html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>爆炸与建筑响应 · 答辩展示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316758a'/%3E%3Cpath d='M8 25V9h7v16m2 0V5h7v20M5 25h22' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./blast_demo.css">
  <link rel="stylesheet" href="./workbench_theme.css">
  <link rel="stylesheet" href="./cpu_blast.css">
  <link rel="stylesheet" href="./preview.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/three.module.min.js"}}
  </script>
  <script type="module" src="./preview.js"></script>
<link rel="stylesheet" href="./defense-pages.css"><script defer src="./defense-pages.js"></script></head><body class="workbench-theme cpu-blast-workbench defense-embedded"><input id="showRoof" type="checkbox" checked hidden><select id="viewChoice" hidden><option value="orbit">全景</option><option value="front">正面</option><option value="top">顶视</option></select><button id="downloadModel" hidden></button><button id="applyView" hidden></button><button id="frontView" hidden></button><button id="topView" hidden></button><article class="cpu-stage" aria-label="三维视图">
      <div class="cpu-stage-heading">
        <div><span class="live-dot"></span><h2>三层阳台住宅</h2></div>
        <span class="cpu-badge">模型外观 · 镜头回放</span>
      </div>
      <div class="viewport" id="viewport">
        <div class="viewport-label"><strong id="viewLabel">三层阳台住宅 / 初始模型</strong><span id="viewHint">拖动旋转 · 滚轮缩放</span></div>
        <div class="view-tools">
          <button id="fitDemo" type="button">⌂ 全景</button><span></span>
          <button id="appearance" class="selected" type="button" aria-pressed="true">外观</button>
          <button id="damage" type="button" aria-pressed="false">损伤图例</button><span></span>
          <button id="captureDemo" type="button">保存图片</button>
          <button id="fullscreenDemo" type="button">全屏</button>
        </div>
        <div class="stage-status" id="stageStatus" role="status">模型加载中</div>
      </div>
      <div class="playback">
        <button id="playDemo" type="button" aria-label="播放镜头">▶</button>
        <output id="timeDisplay" for="timeline">0.00 / 6.00 s</output>
        <input id="timeline" type="range" min="0" max="6" step=".01" value="0" aria-label="镜头时间轴">
        <select id="speed" aria-label="播放速度"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <button id="resetDemo" type="button">重置</button><button type="button" disabled>↓ 结果</button>
      </div></article></body></html>
